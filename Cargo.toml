[package]
name = "tcp_story_teller"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
etherparse = "0.21.0"
pcapture = {version = "0.3.21", features = ["pcapng", "libpnet"]}
serde = "1.0.229"
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
