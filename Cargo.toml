[package]
name = "TcpStoryTeller"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
etherparse = "0.21.0"
pcapture = {version = "0.3.21", features = ["pcapng", "libpnet"]}
serde = "1.0.229"
serde_json = "1.0"

[lints.rust]
unused = "allow"
nonstandard_style = "allow"